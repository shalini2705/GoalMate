<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join Room | GoalMate</title>
  <link rel="stylesheet" href="../css/join.css" />
  <script defer src="../js/join.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="navbar">
  <div class="logo">
  <img src="../assets/images/1.jpg" alt="GoalMate Logo" />
  
</div>

  <div class="navbar-right">
    <nav>
      <a href="../html/main.html">Home</a>
      <a href="../html/join.html">Join Room</a>
      <a href="../html/create.html">Create Room</a>
    </nav>
    <div class="dropdown">
      <span class="nav-icons">👤 ▼</span>
      <div class="dropdown-menu">
        <a href="../html/account.html">Account</a>
        <a href="../html/goal.html">Goals</a>
        <a href="../html/streak.html">Streaks</a>
        <a href="../html/timeline.html">Timeline</a>
      </div>
    </div>
  </div>
</header>


  
  <main class="container">
    <div class="card">
      <div class="card-icon">👥</div>
      <h2>Join a Study Room</h2>
      <p>Enter a Room ID to collaborate with your friends</p>
      <label for="room-id">Room ID</label>
      <div class="input-wrapper">
        <span class="icon">👤</span>
        <input type="text" id="room-id" placeholder="Enter Room ID" />
      </div>
      <button id="join-btn" type="button">Join Room →</button>

      <p class="footer-text">
        Don’t have a Room ID?
        <a href="#">Create a new room</a>
      </p>
    </div>
  </main>
</body>
</html>
